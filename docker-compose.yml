services:
  # ── Database Service (Postgres with PostGIS extension) ──
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: quake-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=quake
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quake"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API Server ──
  api:
    build:
      context: .
      target: api
    container_name: quake-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/quake?sslmode=disable
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PORT=3000
      - NODE_ENV=production
      - DASHBOARD_URL=http://localhost:8080
    command: >
      sh -c "npm run migrate && npx prisma db seed && node apps/api/src/index.js"

  # ── Ingestion Worker ──
  ingestion:
    build:
      context: .
      target: ingestion
    container_name: quake-ingestion
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/quake?sslmode=disable
      - USGS_FEED_URL=${USGS_FEED_URL}
      - USGS_BACKFILL_URL=${USGS_BACKFILL_URL}
      - POLL_INTERVAL_SEC=${POLL_INTERVAL_SEC}
      - NODE_ENV=production

  # ── Decoupled Cron Background Worker ──
  cron:
    build:
      context: .
      target: cron
    container_name: quake-cron
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/quake?sslmode=disable
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - NODE_ENV=production

  # ── Frontend SPA Web App ──
  web:
    build:
      context: .
      target: web
      args:
        - VITE_API_URL=http://localhost:3000
    container_name: quake-web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
